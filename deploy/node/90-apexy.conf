# /etc/sysctl.d/90-apexy.conf: routing for the Apexy VPN node.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
# With forwarding on, Linux ignores router advertisements. If this node's
# IPv6 address or route comes from them (SLAAC), keep accepting them on the
# public interface:
# net.ipv6.conf.eth0.accept_ra = 2

# Nothing about traffic is logged.
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.default.log_martians = 0
