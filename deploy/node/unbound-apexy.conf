# /etc/unbound/unbound.conf.d/apexy.conf: the resolver clients use inside
# the tunnel (the gateway address, published as the node's dnsIpv4).
#
# It keeps no record of queries, answers or who asked.

server:
	interface: 10.64.0.1
	interface: fc00:bbbb:bbbb:bb01::1
	# Start even while wg0 isn't up yet.
	ip-freebind: yes

	access-control: 0.0.0.0/0 refuse
	access-control: ::/0 refuse
	access-control: 10.64.0.0/10 allow
	access-control: fc00:bbbb:bbbb:bb01::/64 allow

	# No logs.
	verbosity: 0
	log-queries: no
	log-replies: no
	log-tag-queryreply: no
	log-local-actions: no
	log-servfail: no
	statistics-interval: 0
	extended-statistics: no

	# Privacy and hardening.
	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-referral-path: yes
	use-caps-for-id: yes
	aggressive-nsec: yes
	prefetch: yes
	# Public names never resolve to private addresses (DNS rebinding).
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-address: 100.64.0.0/10
	private-address: fc00::/7
	private-address: fe80::/10
