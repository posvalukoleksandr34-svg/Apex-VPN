# /etc/wireguard/wg0.conf: the Apexy VPN node interface.
#
# There are no [Peer] sections: apexy-node adds and removes peers as
# accounts gain and lose access. The private key lives in its own file
# (setup.sh creates it), so this file holds no secret.
#
# Every node uses the same addresses: devices are numbered from one pool
# and can connect to any node.

[Interface]
Address = 10.64.0.1/10, fc00:bbbb:bbbb:bb01::1/64
ListenPort = 51820
MTU = 1420
PostUp = wg set %i private-key /etc/wireguard/private.key
# Peers are never written to disk.
SaveConfig = false
