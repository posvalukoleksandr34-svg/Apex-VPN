# Option B (no tunnel): Caddy takes Cloudflare's connections on port 443
# with an Origin CA certificate. Use instead of the tunnel:
#
#   APEXY_DIRECT=1 bash deploy/app/stack.sh production up -d
#
# env/<target>/certs/origin.pem and origin.key: SSL/TLS → Origin Server →
# Create certificate in Cloudflare. TUNNEL_TOKEN can be any placeholder here.

services:
  caddy:
    ports: ["443:443"]
    volumes:
      - ./Caddyfile.direct:/etc/caddy/Caddyfile:ro
      - ${APEXY_ENV_DIR:-../../env/production}/certs:/certs:ro

  cloudflared:
    profiles: ["tunnel"]
